<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>11 «Б» • Расписание & Домашка</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6'
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    function syncTgTheme() {
      const isDark = window.Telegram?.WebApp?.colorScheme === 'dark' ||
                     (!window.Telegram?.WebApp?.colorScheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    syncTgTheme();
    window.Telegram?.WebApp?.onEvent('themeChanged', syncTgTheme);
  </script>
</head>
<body class="min-h-screen pb-24 text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-950 antialiased selection:bg-blue-500 selection:text-white">


  <!-- Header with 11 "Б" Branding -->
  <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800 px-4 py-3">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-sm shadow-md shadow-indigo-500/25 border border-white/20">
          11Б
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-black tracking-tight text-slate-900 dark:text-white">11 «Б» Класс</h1>
            <span class="text-[10px] font-bold px-1.5 py-0.2 rounded-md bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400">2026</span>
          </div>
          <p class="text-[11px] text-slate-400 font-medium" id="user-badge">Загрузка профиля...</p>
        </div>
      </div>
      <button onclick="location.reload()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 text-xs transition-colors">

        🔄

    </div>
  </header>

  <!-- Main Container -->

    <!-- Date selector (Visible on Schedule & Homework tabs) -->

        <!-- Generated dynamically in app.js -->

    <!-- Duty Banner / Widget -->

        <div class="flex items-center gap-2">
          <span class="text-base">🧹</span>
          <span class="text-xs font-bold text-slate-700 dark:text-slate-200">Сейчас дежурит:</span>

      <p class="text-xs text-slate-600 dark:text-slate-300 mt-1.5 leading-relaxed font-medium" id="duty-members">Загрузка состава группы...</p>
    </div>

    <!-- TAB 1: Расписание (Уроки) -->

      <!-- Daily Fact Widget (Only on Lessons/Schedule tab) -->

        <div class="flex items-center justify-between">

          </div>

        <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100 mt-1.5 leading-snug" id="fact-title">Минутку, готовим факт...</h3>

      <div class="flex items-center justify-between">

      </div>

    <!-- TAB 3: Звонки -->

    <!-- TAB 4: Тренажер ЕГЭ -->

    <!-- TAB 5: Мини-игры -->
    <section id="pane-games" class="tab-pane hidden space-y-3">

  </main>

  <!-- Interactive Calendar Modal in Mini App -->
  <div id="calendar-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="theme-card bg-white dark:bg-slate-900 rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800">
      
      <!-- Month & Nav Header -->
      <div class="flex items-center justify-between">
        <button id="cal-prev-month" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm hover:bg-slate-200 transition-colors">◀️</button>
        <h3 id="cal-month-title" class="font-bold text-sm tracking-tight text-slate-800 dark:text-slate-100">Месяц Год</h3>
        <button id="cal-next-month" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm hover:bg-slate-200 transition-colors">▶️</button>
      </div>

      <!-- Weekdays row -->
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 uppercase">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span class="text-red-500">Сб</span><span class="text-red-500">Вс</span>
      </div>

      <!-- Days Grid -->
      <div id="cal-days-grid" class="grid grid-cols-7 gap-1 text-center">
        <!-- Rendered in app.js -->
      </div>

      <!-- Legend & Footer buttons -->
      <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
        <div class="text-[10px] text-slate-400 space-x-1">
          <span>🌴 Каникулы</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="cal-today-btn" class="px-2.5 py-1 rounded-xl bg-blue-50 dark:bg-slate-800 text-blue-600 font-bold text-xs">Сегодня</button>

        </div>

    </div>

          <path d="M6 12h4m-2-2v4m7-2h.01m3 0h.01"></path>

        <span>Игры</span>
      </button>
    </div>
  </nav>

      <div class="flex items-center gap-2 text-white">

      </div>
      <div class="flex items-center gap-2">
        <!-- Zoom Out -->
        <button id="pv-zoom-out" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition-all text-sm font-bold" title="Уменьшить">
          ➖
        </button>
        <!-- Zoom In -->
        <button id="pv-zoom-in" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition-all text-sm font-bold" title="Приблизить">
          ➕

        <!-- Download -->
        <a id="pv-download-btn" href="#" download="homework_photo.jpg" target="_blank" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition-all text-sm" title="Скачать фото">
          📥
        </a>
        <!-- Close -->
        <button id="pv-close-btn" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 text-white flex items-center justify-center transition-all text-base font-bold ml-1" title="Закрыть">
          ✕

      </div>
    </div>

    <!-- Main Viewport (with zoom and pan) -->
    <div id="pv-viewport" class="flex-1 relative flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing touch-none">
      <img id="pv-image" src="" alt="Фото задания" class="max-w-full max-h-full object-contain transition-transform duration-75 origin-center pointer-events-auto select-none" draggable="false" />
      
      <!-- Nav prev/next buttons -->
      <button id="pv-prev-btn" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center text-2xl transition-all shadow-lg hidden">
        ‹
      </button>
      <button id="pv-next-btn" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center text-2xl transition-all shadow-lg hidden">
        ›
      </button>
    </div>

    <!-- Bottom Caption Bar -->
    <div class="p-4 z-10 bg-gradient-to-t from-black/90 via-black/60 to-transparent">
      <p id="pv-caption-title" class="text-white font-bold text-sm truncate"></p>
      <p id="pv-caption-desc" class="text-slate-300 text-xs mt-1 line-clamp-2 leading-relaxed"></p>
    </div>
  </div>
