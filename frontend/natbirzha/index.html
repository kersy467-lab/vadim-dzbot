  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
          }
        }

  <!-- Custom Styles -->

  <link rel="stylesheet" href="/static/natbirzha/css/market-broker.css?v=20260921_broker1" />

  <script>
    function syncTgTheme() {
      const isDark = window.Telegram?.WebApp?.colorScheme === 'dark' ||
                     (!window.Telegram?.WebApp?.colorScheme && window.matchMedia?.('(prefers-color-scheme: dark)')?.matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    syncTgTheme();
    window.Telegram?.WebApp?.onEvent?.('themeChanged', syncTgTheme);
    window.matchMedia?.('(prefers-color-scheme: dark)')?.addEventListener?.('change', syncTgTheme);
  </script>
</head>
