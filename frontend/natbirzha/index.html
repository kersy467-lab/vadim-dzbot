<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>НАТБИРЖА • 11 «Б»</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
          }
        }
      }
    };
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/natbirzha/css/natbirzha.css?v=20260925_energy_mechanic_v5_energy_mechanic_v5" />
  <link rel="stylesheet" href="/static/natbirzha/css/tycoon.css?v=20261009_banner_contrast_v1" />
  <link rel="stylesheet" href="/static/natbirzha/css/market-broker.css?v=20260925_energy_mechanic_v5_energy_mechanic_v5" />
  <link rel="stylesheet" href="/static/natbirzha/css/luxury-theme.css?v=20261010_theme_split_v1" />
  <link rel="stylesheet" href="/static/natbirzha/css/creator-theme.css?v=20261010_theme_split_v1" />
  <link rel="stylesheet" href="/static/natbirzha/css/theme-variants.css?v=20261010_theme_picker_v1" />

  <script>
    document.documentElement.classList.remove('dark');
    document.documentElement.style.colorScheme = 'light';
  </script>
</head>
<body class="min-h-screen text-slate-800 bg-slate-50 antialiased flex flex-col justify-between">

  <section id="access-wait-screen" class="luxury-access fixed inset-0 z-[100] grid min-h-screen min-h-[100dvh] place-items-center overflow-auto px-6 py-10 text-center" role="status" aria-live="polite" style="display:grid">
    <div class="luxury-access-card mx-auto max-w-lg">
      <div class="luxury-access-icon mb-5" data-icon="shield" aria-hidden="true"></div>
      <h1 class="mb-4 text-2xl font-black tracking-tight">ДОСТУП ПОКА ТОЛЬКО АДМИНАМ</h1>
      <p class="text-lg font-bold leading-relaxed">Патч готовится. Скоро откроемся.</p>
    </div>
  </section>

  <!-- Top Navigation / App Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 py-2.5">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-2.5">
        <div class="brand-mark w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs">
          НБ
        </div>
        <div>
          <div class="text-xs font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
            НАТБИРЖА
            <span class="px-1.5 py-0.2 rounded bg-amber-100 dark:bg-amber-950/70 text-amber-700 dark:text-amber-400 text-[10px] font-mono font-bold">11 «Б»</span>
          </div>
          <div id="header-ticker" class="text-[10px] font-mono text-slate-400 leading-none" data-preserve-emoji>Корпорация</div>
        </div>
      </div>

      <!-- Quick Balance Ticker in Header & Creator Button -->
      <div class="flex items-center gap-3">
        <button id="creator-nav-btn" class="hidden min-h-10 px-2.5 py-1 rounded-xl border text-[11px] font-bold flex items-center gap-1 hover:bg-amber-500/30 active:scale-95 transition-all">
          <span data-icon="state" aria-hidden="true"></span> Государство
        </button>
        <div id="header-stats" class="hidden text-right">
          <div id="header-cash" class="text-xs font-black font-mono text-emerald-600 dark:text-emerald-400">
            0 cash
          </div>
          <div class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold">Баланс</div>
        </div>
      </div>
    </div>
    <div class="theme-toolbar px-4" aria-label="Настройки оформления и тестовой игры">
      <button id="next-game-nav-btn" type="button" data-tab="next-game" aria-label="Открыть тестовую игру Натбиржа 2.0" class="nav-tab hidden next-game-launcher">НАТБИРЖА 2.0</button>
      <div class="theme-choice"><label for="theme-select">Тема</label>
        <select id="theme-select" aria-label="Цветовая тема">
          <option value="ivory">Айвори и шалфей</option>
          <option value="midnight">Ночная биржа</option>
          <option value="pearl">Жемчуг и сталь</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Maintenance Banner Container (shown for non-admins when maintenance mode is active) -->
  <div id="maintenance-banner-root" class="w-full max-w-md mx-auto px-4 pt-2.5 hidden"></div>

  <!-- Screen Content Container -->
  <main id="screen-container" class="flex-1 w-full max-w-md mx-auto">
    <!-- Screen components will render here dynamically -->
  </main>

  <!-- Fixed Bottom Navigation Bar -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-2 py-1 hidden">
    <div class="max-w-md mx-auto flex items-center justify-around overflow-x-auto text-center no-scrollbar">
      <button class="nav-tab relative py-2 px-1 text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center gap-0.5 active" data-tab="overview" aria-label="Обзор">
        <span class="nav-icon" data-icon="overview" aria-hidden="true"></span>
        <span class="text-[10px] font-medium">Обзор</span>
      </button>

      <button class="nav-tab relative py-2 px-1 text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center gap-0.5" data-tab="production" aria-label="Заводы">
        <span class="nav-icon" data-icon="factory" aria-hidden="true"></span>
        <span class="text-[10px] font-medium">Заводы</span>
      </button>

      <button class="nav-tab relative py-2 px-1 text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center gap-0.5" data-tab="upgrades" aria-label="Прокачка"><span class="nav-icon" data-icon="upgrade" aria-hidden="true"></span><span class="text-[10px] font-medium">Прокачка</span></button>

      <button class="nav-tab relative py-2 px-1 text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center gap-0.5" data-tab="market" aria-label="Биржа">
        <span class="nav-icon" data-icon="market" aria-hidden="true"></span>
        <span class="text-[10px] font-medium">Биржа</span>
      </button>

      <button class="nav-tab relative py-2 px-1 text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center gap-0.5" data-tab="military" aria-label="Война">
        <span class="nav-icon" data-icon="military" aria-hidden="true"></span>
        <span class="text-[10px] font-medium">Война</span>
      </button>

      <button class="nav-tab relative py-2 px-1 text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center gap-0.5" data-tab="leaderboard" aria-label="Топ">
        <span class="nav-icon" data-icon="leaderboard" aria-hidden="true"></span>
        <span class="text-[10px] font-medium">Топ</span>
      </button>
    </div>
  </nav>

  <!-- Floating Toast Notifications -->
  <div id="toast-container" class="fixed bottom-16 left-4 right-4 z-50 flex flex-col gap-2 items-center"></div>

  <script type="module" src="/static/natbirzha/js/theme_preferences.mjs?v=20261010_theme_picker_v1"></script>
  <script type="module" src="/static/natbirzha/js/app.js?v=20261010_next_game_admin_v1"></script>

</body>
</html>
