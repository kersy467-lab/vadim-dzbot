services:
  - type: web
    name: class-tg-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m backend.main"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: NATBIRZHA_CREATOR_TG_IDS
        sync: false
      - key: NATBIRZHA_ALLOW_TEST_AUTH
        value: "false"
      - key: NATBIRZHA_SEASON_RESET_ENABLED
        value: "false"

      - key: NOTIFICATION_TIME_EVENING
        value: "19:00"
      - key: TIMEZONE
        value: Asia/Yekaterinburg
      - key: GEMINI_API_KEY
        sync: false

