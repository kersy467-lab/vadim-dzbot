services:
  # Deploy source is intentionally pinned to main; keep this comment with the
  # blueprint so a new push also refreshes a stale Render webhook (v8 tax fix).
  - type: web
    name: class-tg-bot
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m backend.main"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DEPLOY_NOTIFY_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: NATBIRZHA_CREATOR_TG_IDS
        sync: false
      - key: NATBIRZHA_ALLOW_TEST_AUTH
        value: "false"
      - key: NATBIRZHA_SEASON_RESET_ENABLED
        value: "false"

      - key: NOTIFICATION_TIME_EVENING
        value: "19:00"
      - key: TIMEZONE
        value: Asia/Yekaterinburg
      - key: GEMINI_API_KEY
        sync: false

